<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="ai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon / shield -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#ai-grad)" />

  <!-- Neural Network & Circuit Connections -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#ai-glow)">
    <!-- Circuit Lines -->
    <path d="M140 180 L200 230 L256 180 L312 230 L372 180" fill="none" stroke-width="8" stroke-dasharray="2 0"/>
    <path d="M200 230 L200 300 L256 350 L312 300 L312 230" fill="none" stroke-width="8"/>
    <path d="M256 180 L256 350" fill="none" stroke-width="8"/>
    <path d="M140 330 L200 300" fill="none" stroke-width="8"/>
    <path d="M372 330 L312 300" fill="none" stroke-width="8"/>
    
    <!-- Central AI Sparkle / Core -->
    <path d="M256 120 L272 164 L316 180 L272 196 L256 240 L240 196 L196 180 L240 164 Z" fill="#ffffff" stroke="none"/>
    
    <!-- Nodes -->
    <circle cx="140" cy="180" r="18" fill="#ffffff" />
    <circle cx="372" cy="180" r="18" fill="#ffffff" />
    <circle cx="140" cy="330" r="18" fill="#ffffff" />
    <circle cx="372" cy="330" r="18" fill="#ffffff" />
    <circle cx="200" cy="230" r="16" fill="#ffffff" />
    <circle cx="312" cy="230" r="16" fill="#ffffff" />
    <circle cx="200" cy="300" r="16" fill="#ffffff" />
    <circle cx="312" cy="300" r="16" fill="#ffffff" />
    <circle cx="256" cy="350" r="20" fill="#ffffff" />
    
    <!-- Inner Accent Dots -->
    <circle cx="140" cy="180" r="8" fill="#6366f1" stroke="none"/>
    <circle cx="372" cy="180" r="8" fill="#6366f1" stroke="none"/>
    <circle cx="140" cy="330" r="8" fill="#06b6d4" stroke="none"/>
    <circle cx="372" cy="330" r="8" fill="#06b6d4" stroke="none"/>
    <circle cx="256" cy="350" r="10" fill="#8b5cf6" stroke="none"/>
  </g>

  <!-- Small accent sparkles -->
  <g fill="#ffffff" opacity="0.95">
    <path d="M380 110 L386 126 L402 132 L386 138 L380 154 L374 138 L358 132 L374 126 Z"/>
    <path d="M120 380 L125 393 L138 398 L125 403 L120 416 L115 403 L102 398 L115 393 Z"/>
  </g>
</svg>
